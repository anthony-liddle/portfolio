name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # /lately prerenders its real content at build time, so the build needs
      # the same credentials the deploy gets. Without them this job used to go
      # green while silently rendering an empty Listening section, which made
      # the check partly decorative: the section it was least able to validate
      # was the one that broke in production.
      - run: pnpm build
        env:
          APPLE_MUSIC_KEY_ID: ${{ secrets.APPLE_MUSIC_KEY_ID }}
          APPLE_MUSIC_TEAM_ID: ${{ secrets.APPLE_MUSIC_TEAM_ID }}
          APPLE_MUSIC_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_MUSIC_PRIVATE_KEY_BASE64 }}
          DISCOGS_USER_TOKEN: ${{ secrets.DISCOGS_USER_TOKEN }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}

      # Reflow (WCAG 1.4.10) at 320px, in a real browser, over every HTML
      # route. Four separate horizontal-scroll bugs shipped before this
      # existed, each found by hand and after release. Chromium is cached
      # because downloading it every run costs more than the check does.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Runs unconditionally rather than only on a cache miss: the cache holds
      # the browser binary, but `--with-deps` also installs OS shared libraries
      # that live outside that path, so a cache hit would otherwise leave
      # chromium present and unable to start. Playwright skips the download
      # itself when the binary is already there, so a warm run is just apt.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm reflow
